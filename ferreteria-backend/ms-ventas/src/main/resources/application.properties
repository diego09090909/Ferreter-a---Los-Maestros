spring.application.name=ms-ventas
server.port=8083

catalogo.url=http://localhost:8082
catalogo.connect-timeout=2s
catalogo.read-timeout=5s

spring.datasource.url=jdbc:mysql://localhost:3306/ferreteria_ventas?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

spring.config.import=optional:file:./secrets.properties,optional:file:./ferreteria-backend/ms-ventas/secrets.properties
