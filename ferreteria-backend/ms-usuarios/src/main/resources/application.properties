spring.application.name=ms-usuarios
server.port=8081


spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ferreteria_usuarios}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.config.import=optional:file:./secrets.properties,optional:file:./ferreteria-backend/ms-usuarios/secrets.properties
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=604800000

server.error.include-message=always
server.error.include-binding-errors=always