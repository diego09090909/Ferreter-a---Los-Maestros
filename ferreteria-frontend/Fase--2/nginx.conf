server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # $http_host conserva el puerto: así Spring ve la misma dirección que el navegador y no lo trata como CORS
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Cumple el mismo papel que el proxy de Vite en desarrollo
    location /api/v1/productos  { proxy_pass http://ms-catalogo:8082; }
    location /api/v1/categorias { proxy_pass http://ms-catalogo:8082; }
    location /api/v1/ventas     { proxy_pass http://ms-ventas:8083; }
    # auth, usuarios y admin
    location /api/v1/           { proxy_pass http://ms-usuarios:8081; }

    # Rutas de React (/catalogo/5, /admin...) vuelven a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
